<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SoloTrackr">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so the icon works as a maskable "any" icon -->
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="320" font-weight="900"
        font-style="italic" fill="#ffffff">S</text>
</svg>
